#############################################
# Techloop Sim - Home Assistant configuration
# CON POSTGRESQL
#############################################

homeassistant:
  name: Techloop Sim
  time_zone: Europe/Rome

default_config:

logger:
  default: info
  logs:
    homeassistant.components.recorder: warning  # Riduci log recorder

#############################################
# DATABASE - PostgreSQL
#############################################

recorder:
  # Connessione PostgreSQL
  db_url: !secret ha_db_url
  
  # Ottimizzazioni performance
  auto_purge: true
  purge_keep_days: 30               # Mantieni 30 giorni di storico
  commit_interval: 1                # Commit ogni secondo
  
  # Esclusioni per ridurre carico DB
  exclude:
    domains:
      - automation
      - updater
      - sun
      - weather
      - person
      - zone
    entity_globs:
      - sensor.time*
      - sensor.date*
      - sensor.*_uptime
      - sensor.*_last_boot
    entities:
      - sun.sun
      
  # Include SOLO i dati essenziali per Techloop
  include:
    domains:
      - climate
    entities:
      # Sensori OTGW (critici per AI)
      - sensor.otgw_room_temp
      - sensor.otgw_outside_temp
      - sensor.otgw_setpoint_ch
      - sensor.otgw_boiler_temp
      - sensor.otgw_return_temp
      - sensor.otgw_boiler_modulation
      - binary_sensor.otgw_ch_enabled
      - binary_sensor.otgw_flame_on
      
      # Sensori AI
      - sensor.ai_trend_room
      - sensor.ai_error_room
      - sensor.ai_room_target_mqtt
      - sensor.ai_embedded_setpoint_grafico
      
      # Input helpers (per analisi UI)
      - input_number.room_target_c
      - input_number.otgw_setpoint_target
      - input_boolean.ai_mode
      - input_boolean.otgw_offline_detected
      - input_boolean.values_out_of_range
      
      # Sensori diagnostica
      - sensor.system_last_range_error
      - sensor.database_size_mb
      - sensor.database_states_count

#############################################
# INPUTS (UI)
#############################################

input_boolean:
  ai_mode:
    name: "AI Mode"
    icon: mdi:brain

  otgw_offline_detected:
    name: "OTGW Offline Detected"
    initial: false
    icon: mdi:alert-circle
  
  values_out_of_range:
    name: "Valori Fuori Range Rilevati"
    initial: false
    icon: mdi:alert-octagon

input_number:
  room_target_c:
    name: "Target stanza"
    min: 16
    max: 26
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermostat

  otgw_setpoint_target:
    name: "Setpoint caldaia (manuale)"
    min: 30
    max: 80
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:fire

#############################################
# MQTT (NEW STYLE)
#############################################

mqtt:
  sensor:
    - name: "OTGW Temperatura stanza"
      unique_id: otgw_room_temp
      state_topic: "otgw/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.room_temp_c | float }}"
      expire_after: 30

    - name: "OTGW Temperatura esterna"
      unique_id: otgw_outside_temp
      state_topic: "otgw/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.outside_temp_c | float }}"
      expire_after: 30

    - name: "OTGW Setpoint CH"
      unique_id: otgw_ch_setpoint
      state_topic: "otgw/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.ch_setpoint_c | float }}"
      expire_after: 30

    - name: "OTGW Temperatura caldaia"
      unique_id: otgw_boiler_temp
      state_topic: "otgw/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.boiler_water_temp_c | float }}"
      expire_after: 30

    - name: "OTGW Temperatura ritorno"
      unique_id: otgw_return_temp
      state_topic: "otgw/telemetry"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.return_water_temp_c | float }}"
      expire_after: 30

    - name: "OTGW Modulazione caldaia"
      unique_id: otgw_boiler_modulation
      state_topic: "otgw/telemetry"
      unit_of_measurement: "%"
      state_class: measurement
      value_template: "{{ value_json.boiler_modulation_percent | float }}"
      expire_after: 30

    - name: "AI Trend stanza"
      unique_id: ai_trend_room
      state_topic: "ai/metrics"
      unit_of_measurement: "°C/min"
      state_class: measurement
      value_template: "{{ value_json.trend_c_per_min | float }}"
      expire_after: 180

    - name: "AI Errore stanza"
      unique_id: ai_error_room
      state_topic: "ai/metrics"
      unit_of_measurement: "°C"
      state_class: measurement
      value_template: "{{ value_json.error_c | float }}"
      expire_after: 180

    - name: "AI Room Target (MQTT)"
      unique_id: ai_room_target_mqtt
      state_topic: "ai/room_target_c"
      unit_of_measurement: "°C"
      state_class: measurement
      value_template: "{{ value | float }}"
      expire_after: 120

    - name: "AI Embedded - Setpoint grafico"
      unique_id: ai_embedded_setpoint_grafico
      state_topic: "ai/decision"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: "{{ value_json.chosen_setpoint_c | float }}"
      expire_after: 180

    - name: "Sistema - Ultimo errore range"
      unique_id: system_last_range_error
      state_topic: "system/errors/range"
      value_template: "{{ value_json.message }}"
      json_attributes_topic: "system/errors/range"
      json_attributes_template: >
        {{ {'sensor': value_json.sensor, 'value': value_json.value, 'min': value_json.min, 'max': value_json.max, 'timestamp': value_json.timestamp} | tojson }}
      expire_after: 600

  binary_sensor:
    - name: "OTGW CH abilitato"
      unique_id: otgw_ch_enabled
      state_topic: "otgw/telemetry"
      value_template: >
        {% set v = value_json.ch_enabled | string | lower %}
        {{ 'ON' if v in ['true','on','1','yes'] else 'OFF' }}
      payload_on: "ON"
      payload_off: "OFF"
      device_class: running
      expire_after: 30

    - name: "OTGW Fiamma"
      unique_id: otgw_flame_on
      state_topic: "otgw/telemetry"
      value_template: >
        {% set v = value_json.flame_on | string | lower %}
        {{ 'ON' if v in ['true','on','1','yes'] else 'OFF' }}
      payload_on: "ON"
      payload_off: "OFF"
      device_class: power
      expire_after: 30

#############################################
# SQL SENSORS - Monitoring Database
#############################################

sensor:
  - platform: sql
    db_url: !secret ha_db_url
    queries:
      - name: "Database Size (MB)"
        query: >
          SELECT 
            ROUND(pg_database_size('homeassistant') / 1024.0 / 1024.0, 2) AS size_mb
        column: 'size_mb'
        unit_of_measurement: 'MB'
      
      - name: "Database States Count"
        query: "SELECT COUNT(*) FROM states"
        column: 'count'
        unit_of_measurement: 'records'
      
      - name: "Database Events Count"
        query: "SELECT COUNT(*) FROM events"
        column: 'count'
        unit_of_measurement: 'records'
      
      - name: "Database Oldest Record"
        query: >
          SELECT 
            EXTRACT(EPOCH FROM (NOW() - MIN(created))) / 86400 AS days_old
          FROM states
        column: 'days_old'
        unit_of_measurement: 'days'

automation: !include automations.yaml