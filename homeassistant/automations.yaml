        - condition: template
          value_template: "{{ states('sensor.otgw_boiler_temp')|float < 0 }}"
        - condition: template
          value_template: "{{ states('sensor.otgw_boiler_temp')|float > 95 }}"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.values_out_of_range
    
    - service: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: "system/errors/range"
        payload: >
          {{
            {
              "sensor": "sensor.otgw_boiler_temp",
              "message": "Temperatura caldaia anomala",
              "value": states('sensor.otgw_boiler_temp')|float,
              "min": 0,
              "max": 95,
              "timestamp": now().isoformat()
            } | tojson
          }}
    
    - service: persistent_notification.create
      data:
        notification_id: "boiler_temp_anomaly"
        title: "🔥 TEMPERATURA CALDAIA ANOMALA"
        message: >
          La temperatura caldaia è fuori dal range di sicurezza.
          
          **Valore rilevato:** {{ states('sensor.otgw_boiler_temp') }}°C
          **Range sicuro:** 0°C ÷ 95°C
          
          {% if states('sensor.otgw_boiler_temp')|float > 95 %}
          ⚠️ **PERICOLO SURRISCALDAMENTO**
          {% endif %}
          
          Tempo: {{ now().strftime('%H:%M:%S') }}

