#############################################
# Techloop Sim - automations.yaml
# Logica:
# - AI engine pubblica otgw/cmd + ai/decision + ai/metrics
# - Home Assistant invia input (ai/mode + ai/room_target_c)
# - Slider manuale comanda OTGW solo quando AI OFF
#############################################

#############################################
# 1) LOCK SLIDER quando AI Mode è ON
#############################################
- id: "lock_manual_setpoint_when_ai_on"
  alias: "LOCK - Blocca slider setpoint quando AI Mode è ON"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"
    - condition: template
      value_template: >
        {{ states('sensor.otgw_setpoint_ch') not in ['unknown','unavailable','none',''] }}
    - condition: template
      value_template: >
        {{ (states('input_number.otgw_setpoint_target')|float - states('sensor.otgw_setpoint_ch')|float) | abs > 0.1 }}
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.otgw_setpoint_target
      data:
        value: "{{ states('sensor.otgw_setpoint_ch') | float }}"


#############################################
# 2) Setpoint MANUALE → MQTT (solo AI OFF)
#############################################
- id: "otgw_setpoint_ch_via_mqtt"
  alias: "OTGW – Setpoint CH via MQTT (manuale)"
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
    - condition: template
      value_template: >
        {{ states('input_number.otgw_setpoint_target') not in ['unknown','unavailable','none',''] }}
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: "otgw/cmd"
        payload: >
          {{ {"ch_setpoint_c": states('input_number.otgw_setpoint_target') | float, "ch_enabled": true} | tojson }}


#############################################
# 3) AI Mode → MQTT (ON / OFF)  (engine ascolta ai/mode)
#############################################
- id: "ai_mode_to_mqtt"
  alias: "AI Mode -> MQTT ai/mode"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.ai_mode
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/mode"
        payload: "{{ 'ON' if is_state('input_boolean.ai_mode','on') else 'OFF' }}"


#############################################
# 4) Target stanza → MQTT  (engine ascolta ai/room_target_c)
#############################################
- id: "room_target_to_mqtt"
  alias: "ROOM TARGET -> MQTT ai/room_target_c"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.room_target_c
  condition:
    - condition: template
      value_template: >
        {{ states('input_number.room_target_c') not in ['unknown','unavailable','none',''] }}
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/room_target_c"
        payload: "{{ states('input_number.room_target_c') | float }}"
