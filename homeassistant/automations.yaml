#############################################
# 1) LOCK SLIDER quando AI Mode è ON
#############################################
- id: "lock_manual_setpoint_when_ai_on"
  alias: "LOCK - Blocca slider setpoint quando AI Mode è ON"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"
    - condition: template
      value_template: >
        {{ states('sensor.otgw_setpoint_ch') not in ['unknown','unavailable','none',''] }}
    - condition: template
      value_template: >
        {{ (states('input_number.otgw_setpoint_target') | float - states('sensor.otgw_setpoint_ch') | float) | abs > 0.1 }}
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.otgw_setpoint_target
      data:
        value: "{{ states('sensor.otgw_setpoint_ch') | float }}"


#############################################
# 2) Setpoint MANUALE → MQTT (solo AI OFF)
#############################################
- id: "otgw_setpoint_ch_via_mqtt"
  alias: "OTGW – Setpoint CH via MQTT (manuale)"
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: "otgw/cmd"
        payload: >
          {{ {"ch_setpoint_c": states('input_number.otgw_setpoint_target') | float } | tojson }}


#############################################
# 3) AI Mode → MQTT (ON / OFF)  [per AI esterna]
#############################################
- id: "ai_mode_to_mqtt"
  alias: "AI Mode -> MQTT ai/mode"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.ai_mode
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/mode"
        payload: "{{ 'ON' if is_state('input_boolean.ai_mode','on') else 'OFF' }}"


#############################################
# 4) Target stanza → MQTT (per AI esterna)
#############################################
- id: "room_target_to_mqtt"
  alias: "ROOM TARGET -> MQTT ai/room_target_c"
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.room_target_c
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/room_target_c"
        payload: "{{ states('input_number.room_target_c') | float }}"


#############################################
# 5) AI Embedded: Rules v2 → Pubblica dataset + decision (EMBEDDED)
#    (NON comanda direttamente OTGW)
#############################################
- id: "ai_rules_publish_decision_v2"
  alias: "AI Rules v2 → Pubblica decisione (embedded) + dataset"
  mode: single
  trigger:
    - platform: time_pattern
      seconds: "/15"
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"

  action:
    - variables:
        # Letture base
        room: "{{ states('sensor.otgw_temperatura_stanza') | float(0) }}"
        outside: "{{ states('sensor.otgw_temperatura_esterna') | float(10) }}"
        target: "{{ states('input_number.room_target_c') | float(21) }}"
        current_sp: "{{ states('sensor.otgw_setpoint_ch') | float(45) }}"

        # Feedback caldaia
        mod: "{{ states('sensor.otgw_modulazione_caldaia') | float(0) }}"
        flame: "{{ is_state('binary_sensor.otgw_fiamma', 'on') }}"

        # Memoria per trend
        last_room: "{{ states('input_number.ai_last_room_temp') | float(room) }}"
        last_chosen: "{{ states('input_number.ai_last_chosen_setpoint') | float(current_sp) }}"

        # Trend approssimato su 15s (delta °C per ciclo)
        droom: "{{ room - last_room }}"

        # Deadband target
        err: "{{ target - room }}"
        near_target: "{{ err | abs < 0.2 }}"

        # --- 1) Curva climatica base ---
        base: >
          {% set b = 35 + (20 - outside) * 1.0 %}
          {{ [70, [30, b] | max] | min }}

        # --- 2) Correzione errore stanza (P) ---
        corr_p: >
          {% if near_target %}
            0
          {% else %}
            {{ err * 6.0 }}
          {% endif %}

        # --- 3) Anti-overshoot basato su trend ---
        overshoot_guard: >
          {% if (err < 0.4) and (droom > 0.05) %}
            -4
          {% elif (err < 0.8) and (droom > 0.08) %}
            -2
          {% else %}
            0
          {% endif %}

        # --- 4) Boost se stagnante ---
        stagnating: "{{ (err > 0.6) and (droom < 0.02) }}"
        boost: >
          {% if stagnating and flame and (mod > 30) %}
            4
          {% elif stagnating %}
            2
          {% else %}
            0
          {% endif %}

        # --- 5) Guard modulazione ---
        mod_guard: >
          {% if (mod > 70) and (err < 1.0) %}
            -3
          {% else %}
            0
          {% endif %}

        # Setpoint desiderato grezzo
        raw: "{{ base + corr_p + overshoot_guard + boost + mod_guard }}"

        # clamp 30..80
        desired: >
          {% set d = raw %}
          {{ [80, [30, d] | max] | min }}

        # smoothing: max ±2°C per ciclo
        max_step: 2.0
        chosen: >
          {% set diff = (desired | float) - (current_sp | float) %}
          {% if diff > max_step %}
            {{ (current_sp | float) + max_step }}
          {% elif diff < -max_step %}
            {{ (current_sp | float) - max_step }}
          {% else %}
            {{ desired | float }}
          {% endif %}

        # arrotonda a 0.5°C
        chosen_round: "{{ ((chosen | float) * 2) | round(0) / 2 }}"

        # pubblica solo se cambia abbastanza
        should_publish: "{{ (chosen_round - (current_sp | float)) | abs >= 0.5 }}"

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ should_publish }}"
          sequence:
            # DATASET embedded (per AI esterna)
            - service: mqtt.publish
              data:
                topic: "ai/dataset/embedded"
                retain: false
                payload: >
                  {
                    "ts": "{{ now().isoformat() }}",
                    "room": {{ room }},
                    "outside": {{ outside }},
                    "target": {{ target }},
                    "otgw_setpoint": {{ current_sp }},
                    "mod": {{ mod }},
                    "flame": {{ "true" if flame else "false" }},
                    "chosen": {{ chosen_round }}
                  }

            # DECISION embedded
            - service: mqtt.publish
              data:
                topic: "ai/decision/embedded"
                retain: false
                payload: >
                  {
                    "ts": "{{ now().isoformat() }}",
                    "source": "embedded",
                    "room_target_c": {{ target }},
                    "room_temp_c": {{ room }},
                    "outside_temp_c": {{ outside }},
                    "droom_per_tick_c": {{ droom }},
                    "boiler_modulation_percent": {{ mod }},
                    "flame_on": {{ "true" if flame else "false" }},
                    "base_curve_c": {{ base }},
                    "error_c": {{ err }},
                    "boost_c": {{ boost }},
                    "overshoot_guard_c": {{ overshoot_guard }},
                    "mod_guard_c": {{ mod_guard }},
                    "chosen_setpoint_c": {{ chosen_round }},
                    "ch_enabled": true
                  }

            # aggiorna memoria trend
            - service: input_number.set_value
              target:
                entity_id: input_number.ai_last_room_temp
              data:
                value: "{{ room }}"

            - service: input_number.set_value
              target:
                entity_id: input_number.ai_last_chosen_setpoint
              data:
                value: "{{ chosen_round }}"


#############################################
# 6) ROUTER UNICO → OTGW (sceglie embedded/external)
#    (questa è L'UNICA automazione che pubblica su otgw/cmd in AI mode)
#############################################
- id: "ai_router_to_otgw"
  alias: "AI Router → OTGW (embedded / external)"
  mode: single
  trigger:
    - platform: mqtt
      topic: "ai/decision/embedded"
    - platform: mqtt
      topic: "ai/decision/external"

  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"

    # Usa SOLO la sorgente selezionata
    - condition: template
      value_template: >
        {% set src = states('input_select.ai_source') %}
        {% set ext_alive = is_state('binary_sensor.ai_external_alive','on') %}
        {% if src == 'embedded' %}
          {{ trigger.topic == 'ai/decision/embedded' }}
        {% elif src == 'external' %}
          {{ trigger.topic == 'ai/decision/external' }}
        {% elif src == 'auto' %}
          {{ (ext_alive and trigger.topic == 'ai/decision/external')
             or ((not ext_alive) and trigger.topic == 'ai/decision/embedded') }}
        {% else %}
          false
        {% endif %}

    # Anti-loop: manda comando solo se serve davvero
    - condition: template
      value_template: >
        {{ (trigger.payload_json.chosen_setpoint_c | float(0)
            - states('sensor.otgw_setpoint_ch') | float(0)) | abs >= 0.5 }}

  action:
    - service: mqtt.publish
      data:
        topic: "otgw/cmd_ai"
        qos: 0
        retain: false
        payload: >
          {% set sp = trigger.payload_json.chosen_setpoint_c | float(55) %}
          {% set sp = [80, [30, sp] | max] | min %}
          {{ {"ch_setpoint_c": sp} | tojson }}

- id: "ai_auto_source_switch"
  alias: "AI Auto Source → external se alive, altrimenti embedded"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ai_external_alive
    - platform: state
      entity_id: input_boolean.ai_mode
    - platform: time_pattern
      seconds: "/30"
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"
    - condition: state
      entity_id: input_boolean.ai_auto_source
      state: "on"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.ai_external_alive
              state: "on"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.ai_source
              data:
                option: "auto"
      default:
        - service: input_select.select_option
          target:
            entity_id: input_select.ai_source
          data:
            option: "auto"
- id: "otgw_cmd_bridge"
  alias: "OTGW CMD Bridge (UNICO)"
  mode: single
  trigger:
    - platform: mqtt
      topic: "otgw/cmd_ai"
  action:
    - service: mqtt.publish
      data:
        topic: "otgw/cmd"
        qos: 0
        retain: false
        payload: "{{ trigger.payload }}"
