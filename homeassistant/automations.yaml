          Tempo: {{ now().strftime('%H:%M:%S') }}

# Ripristina flag quando tutti i valori tornano normali
- id: "error_range_values_restored"
  alias: "ERROR - Valori tornati in range"
  mode: single
  trigger:
    - platform: state
      entity_id: 
        - sensor.otgw_room_temp
        - sensor.otgw_boiler_temp
        - sensor.otgw_boiler_modulation
      for:
        seconds: 30  # aspetta 30s di stabilità
  condition:
    - condition: state
      entity_id: input_boolean.values_out_of_range
      state: "on"
    # Verifica che TUTTI i valori siano in range
    - condition: template
      value_template: >
        {% set room = states('sensor.otgw_room_temp')|float(default=-999) %}
        {% set boiler = states('sensor.otgw_boiler_temp')|float(default=-999) %}
        {% set mod = states('sensor.otgw_boiler_modulation')|float(default=-999) %}
        {{
          room > -10 and room < 50 and
          boiler > 0 and boiler < 95 and
          mod >= 0 and mod <= 100
        }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.values_out_of_range
    
    - service: persistent_notification.create
      data:
        notification_id: "range_restored"
        title: "✅ Valori Tornati Normali"
        message: >
          Tutti i sensori sono tornati in range normale.
          
          **Valori attuali:**
          - 🌡️ Stanza: {{ states('sensor.otgw_room_temp') }}°C
          - 🔥 Caldaia: {{ states('sensor.otgw_boiler_temp') }}°C
          - ⚙️ Modulazione: {{ states('sensor.otgw_boiler_modulation') }}%
          
          Tempo: {{ now().strftime('%H:%M:%S') }}
    
    # Rimuovi vecchie notifiche di errore
    - delay:
        seconds: 2
    - service: persistent_notification.dismiss
      data:
        notification_id: "room_temp_anomaly"
    - service: persistent_notification.dismiss
      data:
        notification_id: "boiler_temp_anomaly"
    - service: persistent_notification.dismiss
      data:
        notification_id: "modulation_anomaly"

# Blocca AI se valori fuori range (sicurezza)
- id: "error_disable_ai_on_range_error"
  alias: "ERROR - Disabilita AI se valori anomali"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.values_out_of_range
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ai_mode
    
    - service: persistent_notification.create
      data:
        notification_id: "ai_disabled_safety"
        title: "🛡️ AI DISABILITATA PER SICUREZZA"
        message: >
          L'AI è stata disabilitata automaticamente a causa di valori anomali.
          
          Sistema passato a **controllo manuale**.
          
          L'AI si riattiverà quando i valori torneranno normali.
          
          Tempo: {{ now().strftime('%H:%M:%S') }}