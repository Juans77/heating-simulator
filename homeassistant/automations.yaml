#############################################
# 1) LOCK SLIDER quando AI Mode è ON
#############################################
- id: "lock_manual_setpoint_when_ai_on"
  alias: "LOCK - Blocca slider setpoint quando AI Mode è ON"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unknown','unavailable','none',''] }}
    - condition: template
      value_template: >
        {{ (trigger.to_state.state|float - trigger.from_state.state|float)|abs > 0.1 }}
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.otgw_setpoint_target
      data:
        value: "{{ states('sensor.otgw_setpoint_ch') | float }}"

#############################################
# 2) Setpoint MANUALE → MQTT (solo AI OFF)
#############################################
- id: "otgw_setpoint_ch_via_mqtt"
  alias: "OTGW – Setpoint CH via MQTT (manuale)"
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
    - condition: state  # NUOVO: verifica OTGW online
      entity_id: input_boolean.otgw_offline_detected
      state: "off"
    - condition: template
      value_template: >
        {{ states('input_number.otgw_setpoint_target') not in ['unknown','unavailable','none',''] }}
    - condition: template  # NUOVO: verifica cambio significativo
      value_template: >
        {{ (trigger.to_state.state|float - trigger.from_state.state|float)|abs > 0.2 }}
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: "otgw/cmd"
        payload: >
          {{ {"ch_setpoint_c": states('input_number.otgw_setpoint_target') | float, "ch_enabled": true} | tojson }} 

#############################################
# 3) AI Mode → MQTT
#############################################
- id: "ai_mode_to_mqtt"
  alias: "AI Mode -> MQTT ai/mode"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.ai_mode
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/mode"
        payload: "{{ 'ON' if is_state('input_boolean.ai_mode','on') else 'OFF' }}"

#############################################
# 4) Target stanza → MQTT
#############################################
- id: "room_target_to_mqtt"
  alias: "ROOM TARGET -> MQTT ai/room_target_c"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.room_target_c
  condition:
    - condition: template
      value_template: >
        {{ states('input_number.room_target_c') not in ['unknown','unavailable','none',''] }}
  action:
    - service: mqtt.publish
      data:
        qos: 0
        retain: true
        topic: "ai/room_target_c"
        payload: "{{ states('input_number.room_target_c') | float }}"


#############################################
# GESTIONE ERRORI - OTGW OFFLINE
#############################################

# Rileva quando OTGW va offline
- id: "error_otgw_offline_detect"
  alias: "ERROR - OTGW Offline Rilevato"
  mode: single
  trigger:
    - platform: state
      entity_id: 
        - sensor.otgw_room_temp
        - sensor.otgw_setpoint_ch
        - binary_sensor.otgw_ch_enabled
      to: "unavailable"
      for:
        seconds: 5  # aspetta 5s per evitare falsi positivi
  condition:
    - condition: state
      entity_id: input_boolean.otgw_offline_detected
      state: "off"
  action:
    # Attiva flag offline
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.otgw_offline_detected
    
    # Notifica persistente
    - service: persistent_notification.create
      data:
        notification_id: "otgw_offline"
        title: "⚠️ OTGW OFFLINE"
        message: >
          OpenTherm Gateway non risponde da più di 35 secondi.
          
          **Azioni automatiche:**
          - ❌ Comandi MQTT bloccati
          - 🔄 Sistema in attesa di ripristino
          
          **Sensori offline:** {{ trigger.to_state.name }}
          
          Tempo: {{ now().strftime('%H:%M:%S') }}

# Ripristina quando OTGW torna online
- id: "error_otgw_online_restore"
  alias: "ERROR - OTGW Ripristinato"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.otgw_room_temp
      from: "unavailable"
    - platform: state
      entity_id: sensor.otgw_setpoint_ch
      from: "unavailable"
  condition:
    - condition: state
      entity_id: input_boolean.otgw_offline_detected
      state: "on"
    # Verifica che ALMENO i sensori critici siano online
    - condition: template
      value_template: >
        {{ states('sensor.otgw_room_temp') not in ['unavailable','unknown','none',''] 
           and states('sensor.otgw_setpoint_ch') not in ['unavailable','unknown','none',''] }}
  action:
    # Disattiva flag offline
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.otgw_offline_detected
    
    # Notifica ripristino
    - service: persistent_notification.create
      data:
        notification_id: "otgw_restored"
        title: "✅ OTGW RIPRISTINATO"
        message: >
          OpenTherm Gateway è tornato online.
          
          **Stato attuale:**
          - 🌡️ Temp stanza: {{ states('sensor.otgw_room_temp') }}°C
          - 🔥 Setpoint CH: {{ states('sensor.otgw_setpoint_ch') }}°C
          - 💨 CH abilitato: {{ states('binary_sensor.otgw_ch_enabled') }}
          
          Tempo: {{ now().strftime('%H:%M:%S') }}
    
    # Rimuovi vecchia notifica offline
    - delay:
        seconds: 2
    - service: persistent_notification.dismiss
      data:
        notification_id: "otgw_offline"

# Blocca comandi manuali se OTGW offline
- id: "error_block_manual_if_otgw_offline"
  alias: "ERROR - Blocca comandi manuali se OTGW offline"
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.otgw_offline_detected
      state: "on"
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
  action:
    - service: persistent_notification.create
      data:
        notification_id: "otgw_cmd_blocked"
        title: "🚫 Comando Bloccato"
        message: >
          Non posso inviare il setpoint perché OTGW è offline.
          
          Attendi il ripristino della connessione.



#############################################
# GESTIONE ERRORI - VALORI FUORI RANGE
#############################################

# Valida setpoint manuale prima dell'invio
- id: "error_validate_manual_setpoint"
  alias: "ERROR - Valida setpoint manuale (range 30-80°C)"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.otgw_setpoint_target
  condition:
    - condition: state
      entity_id: input_boolean.ai_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.otgw_offline_detected
      state: "off"
    - condition: template
      value_template: >
        {{ states('input_number.otgw_setpoint_target') not in ['unknown','unavailable','none',''] }}
  action:
    - choose:
        # Caso 1: Valore troppo basso (<30°C)
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.otgw_setpoint_target')|float < 30 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.otgw_setpoint_target
              data:
                value: 30
            - service: persistent_notification.create
              data:
                notification_id: "setpoint_too_low"
                title: "⚠️ Setpoint Troppo Basso"
                message: >
                  Il setpoint è stato corretto a 30°C (minimo consentito).
                  
                  Valore richiesto: {{ trigger.to_state.state }}°C
                  
                  Tempo: {{ now().strftime('%H:%M:%S') }}
        
        # Caso 2: Valore troppo alto (>80°C)
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.otgw_setpoint_target')|float > 80 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.otgw_setpoint_target
              data:
                value: 80
            - service: persistent_notification.create
              data:
                notification_id: "setpoint_too_high"
                title: "⚠️ Setpoint Troppo Alto"
                message: >
                  Il setpoint è stato corretto a 80°C (massimo consentito).
                  
                  Valore richiesto: {{ trigger.to_state.state }}°C
                  
                  Tempo: {{ now().strftime('%H:%M:%S') }}

# Rileva temperatura stanza anomala
- id: "error_room_temp_out_of_range"
  alias: "ERROR - Temperatura stanza fuori range (-10/50°C)"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.otgw_room_temp
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.otgw_room_temp') not in ['unknown','unavailable','none',''] }}
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ states('sensor.otgw_room_temp')|float < -10 }}"
        - condition: template
          value_template: "{{ states('sensor.otgw_room_temp')|float > 50 }}"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.values_out_of_range
    
    - service: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: "system/errors/range"
        payload: >
          {{
            {
              "sensor": "sensor.otgw_room_temp",
              "message": "Temperatura stanza anomala",
              "value": states('sensor.otgw_room_temp')|float,
              "min": -10,
              "max": 50,
              "timestamp": now().isoformat()
            } | tojson
          }}
    
    - service: persistent_notification.create
      data:
        notification_id: "room_temp_anomaly"
        title: "🌡️ TEMPERATURA STANZA ANOMALA"
        message: >
          La temperatura stanza rilevata è fuori dal range normale.
          
          **Valore rilevato:** {{ states('sensor.otgw_room_temp') }}°C
          **Range normale:** -10°C ÷ 50°C
          
          ⚠️ Possibili cause:
          - Sensore malfunzionante
          - Errore di lettura OTGW
          - Problema hardware
          
          Tempo: {{ now().strftime('%H:%M:%S') }}

