services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: techloop-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped


  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: techloop-homeassistant
    depends_on:
      - mosquitto
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
    environment:
      - TZ=Europe/Rome
    restart: unless-stopped


  simulator:
    build: ./simulator
    container_name: techloop-simulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_BASE_TOPIC=otgw
      - PUBLISH_INTERVAL=2
      - TZ=Europe/Rome
    restart: unless-stopped


  ai-engine:
    build: ./ai-engine
    container_name: techloop-ai-engine
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - TELEMETRY_TOPIC=otgw/telemetry
      - CMD_TOPIC=otgw/cmd
      - AI_MODE_TOPIC=ai/mode
      - ROOM_TARGET_TOPIC=ai/room_target_c
      - DECISION_TOPIC=ai/decision
      - STATUS_TOPIC=ai/engine/status
      - METRICS_TOPIC=ai/metrics
      - PUBLISH_MIN_INTERVAL_S=60
      - MAX_STEP_C=1.0
      - DEADBAND_C=0.2
      - PUBLISH_MIN_DELTA_C=0.5
      - ALERTS_TOPIC=ai/alerts
      - DROP_THRESHOLD_C_PER_MIN=0.6
      - WINDOW_HOLD_MIN=3
      - ALERT_COOLDOWN_S=600
      - INEFF_ERR_MIN_C=0.3
      - INEFF_MOD_MIN=20
      - INEFF_TREND_MAX_C_PER_MIN=0.2
      - INEFF_DURATION_S=60
      - INEFF_ALERT_COOLDOWN_S=900
      - INEFF_TEST_BOOST_C=5
      - INEFF_TEST_MIN=10
      - PROFILE=comfort
      - KP=1.00
      - BASE=49.0
      - AUTOTUNE_STATE=/data/autotune_state.json
    volumes:
      - ./ai-engine/data:/data
    restart: unless-stopped
