version: "3.9"

services:
  #############################################
  # PostgreSQL Database
  #############################################
  postgres:
    image: postgres:15-alpine
    container_name: techloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeassistant}
      POSTGRES_USER: ${POSTGRES_USER:-ha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env (vedi .env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Rome
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"  # esposto solo in locale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ha_user -d homeassistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techloop
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"

  #############################################
  # MQTT Broker
  #############################################
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: techloop-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - techloop

  #############################################
  # Home Assistant
  #############################################
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: techloop-homeassistant
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
    environment:
      - TZ=Europe/Rome
    restart: unless-stopped
    networks:
      - techloop

  #############################################
  # OTGW Simulator
  #############################################
  simulator:
    build: ./simulator
    container_name: techloop-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_BASE_TOPIC=otgw
      - PUBLISH_INTERVAL=2
      - TZ=Europe/Rome
    restart: unless-stopped
    networks:
      - techloop

  #############################################
  # AI Engine
  #############################################
  ai-engine:
    build: ./ai-engine
    container_name: techloop-ai-engine
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - TELEMETRY_TOPIC=otgw/telemetry
      - CMD_TOPIC=otgw/cmd
      - AI_MODE_TOPIC=ai/mode
      - ROOM_TARGET_TOPIC=ai/room_target_c
      - DECISION_TOPIC=ai/decision
      - STATUS_TOPIC=ai/engine/status
      - METRICS_TOPIC=ai/metrics
      - ALERTS_TOPIC=ai/alerts

      - PUBLISH_MIN_INTERVAL_S=60
      - MAX_STEP_C=1.0
      - DEADBAND_C=0.2
      - PUBLISH_MIN_DELTA_C=0.5

      - DROP_THRESHOLD_C_PER_MIN=0.6
      - WINDOW_HOLD_MIN=3
      - ALERT_COOLDOWN_S=600

      - INEFF_ERR_MIN_C=0.3
      - INEFF_MOD_MIN=20
      - INEFF_TREND_MAX_C_PER_MIN=0.2
      - INEFF_DURATION_S=60
      - INEFF_ALERT_COOLDOWN_S=900
      - INEFF_TEST_BOOST_C=5
      - INEFF_TEST_MIN=10

      - PROFILE=comfort
      - KP=1.00
      - BASE=49.0
      - AUTOTUNE_STATE=/data/autotune_state.json
    volumes:
      - ./ai-engine/data:/data
    restart: unless-stopped
    networks:
      - techloop

  #############################################
  # pgAdmin (opzionale - per gestione DB)
  #############################################
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techloop-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@techloop.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Imposta PGADMIN_DEFAULT_PASSWORD nel file .env (vedi .env.example)}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"  # esposto solo in locale
    networks:
      - techloop
    profiles:
      - admin  # Attiva solo con: docker-compose --profile admin up

networks:
  techloop:
    name: techloop-net
    driver: bridge