services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: techloop-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: techloop-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama:/root/.ollama

  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: techloop-homeassistant
    depends_on:
      - mosquitto
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
    environment:
      - TZ=Europe/Rome
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: techloop-simulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_BASE_TOPIC=otgw
      - PUBLISH_INTERVAL=2
      - TZ=Europe/Rome
    restart: unless-stopped

  ai-engine:
    build: ./ai-engine
    container_name: techloop-ai-engine
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TELEMETRY_TOPIC: otgw/telemetry
      CMD_TOPIC: otgw/cmd
      AI_MODE_TOPIC: ai/mode
      ROOM_TARGET_TOPIC: ai/room_target_c
      DECISION_TOPIC: ai/decision
    restart: unless-stopped

  ai-external:
    build: ./ai-external
    container_name: techloop-ai-external
    depends_on:
      - mosquitto
      - ollama
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - DECISION_TOPIC=ai/decision/external
      - DATASET_TOPIC=ai/dataset/embedded
      - STATUS_TOPIC=ai/external/status
      - HEARTBEAT_SECONDS=10
      - MIN_SETPOINT=30
      - MAX_SETPOINT=80
    restart: unless-stopped

volumes:
  ollama:
