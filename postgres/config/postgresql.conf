# ================================================
# Techloop Sim - PostgreSQL Custom Configuration
# ================================================
# Posiziona questo file in ./postgres/config/postgresql.conf
# e monta in Docker se vuoi sovrascrivere configurazioni

# CONNESSIONI
listen_addresses = '*'
max_connections = 50
superuser_reserved_connections = 3

# MEMORIA
shared_buffers = 256MB              # 25% RAM disponibile
effective_cache_size = 512MB        # 50% RAM disponibile
work_mem = 16MB                     # Per query sorting
maintenance_work_mem = 64MB         # Per vacuum/index

# WRITE-AHEAD LOG (WAL)
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# QUERY PLANNING
random_page_cost = 1.1              # SSD/NVMe (default 4.0 per HDD)
effective_io_concurrency = 200      # SSD/NVMe (default 1 per HDD)
default_statistics_target = 100

# LOGGING (utile per debug)
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # Log query >1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'Europe/Rome'

# AUTOVACUUM (importante per Home Assistant)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10min          # Controlla ogni 10min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# LOCALE
datestyle = 'iso, mdy'
timezone = 'Europe/Rome'
lc_messages = 'en_US.utf8'
lc_monetary = 'it_IT.utf8'
lc_numeric = 'it_IT.utf8'
lc_time = 'it_IT.utf8'
default_text_search_config = 'pg_catalog.english'